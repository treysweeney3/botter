name: Botter
options:
  bundleIdPrefix: com.treysweeney
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
packages:
  BotterKit:
    path: BotterKit
targets:
  Botter:
    type: application
    platform: macOS
    sources:
      - path: Botter
        excludes:
          - AppIcon.icon
      - path: Botter/AppIcon.icon
        type: file
    dependencies:
      - package: BotterKit
    info:
      path: Botter/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.treysweeney.botter
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Botter:
    build:
      targets:
        Botter: all
    run:
      config: Debug
