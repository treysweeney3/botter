[project]
name = "botterd"
version = "0.1.0"
description = "Local Botter companion service and contract-identical mock server"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "ruamel-yaml>=0.18,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
botterd = "botterd.main:run"
mock = "mockserver.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["botterd", "mockserver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

